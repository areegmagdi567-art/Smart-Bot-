```yaml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev
        pip install buildozer cython

    - name: Build with Buildozer
      run: |
        yes | buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd,google-generativeai,arabic-reshaper,python-bidi/g' buildozer.spec
        buildozer android release || buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CollegeBot-APK
        path: bin/*.apk

```