name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip tar openjdk-17-jdk
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build APK with Buildozer
      run: |
        yes | buildozer init
        # الموافقة التلقائية على جميع رخص Android SDK
        yes | android-update-sdk --accept-licenses || true
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd,google-generativeai,arabic-reshaper,python-bidi/g' buildozer.spec
        # قبول شروط التجميع
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CollegeBot-APK
        path: bin/*.apk

